type Movie{
    id: ID!
    title: String!
    originalTitle: String!
    overview: String
    releaseDate: Date!
    poster: String
    backDrop: String
    votingAverage: Float
    adult: Boolean
    language: String!
    createdTimestamp: Timestamp!
    modifiedTimestamp: Timestamp!
    active: Boolean!
}

type MovieResponse{
    ok: Boolean!
    body: MovieResponseBody
}

type MovieResponseBody{
    statusCode: Int!
    movies: [Movie]
}